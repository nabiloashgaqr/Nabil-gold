name: ✅ Tests

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      # Hardened (2026-08-06): no external actions (GitHub action-download
      # service outage). Direct clone with built-in GITHUB_TOKEN.
      - name: 📥 Checkout (no external action)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      - name: 🐍 Prepare Python (system)
        run: |
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python || true
          python --version
          python -m pip install --upgrade pip

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔎 Validate test setup
        run: |
          python scripts/validate_setup.py test

      - name: 🧪 Run Tests
        run: |
          python -m pytest tests/ -v
