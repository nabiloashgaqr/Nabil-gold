name: 📊 Dashboard

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true


on:
  # Scheduling is handled externally by cron-job.org
  workflow_dispatch:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Hardened (2026-08-06): no external actions (GitHub action-download
      # service outage). Direct clone with built-in GITHUB_TOKEN.
      - name: 📥 Checkout (no external action)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      - name: 🐍 Prepare Python (system)
        run: |
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python || true
          python --version
          python -m pip install --upgrade pip

      - name: 📦 Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: 📊 Generate Dashboard
        run: |
          python scripts/generate_dashboard.py
        env:
          # Paper trading is STOPPED; the dashboard now reports the demo stream.
          TRADES_TABLE: trades_demo
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM: "true"

      - name: 📤 Upload Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-dashboard
          path: storage/dashboard.html
