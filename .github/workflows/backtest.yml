name: 🧪 Backtest

concurrency:
  group: backtest-${{ github.ref }}
  cancel-in-progress: true


on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: 'Timeframe: 5m, 15m, 1H, 4H'
        required: false
        default: '15m'
      outputsize:
        description: 'Number of candles to fetch'
        required: false
        default: '420'
      window:
        description: 'Rolling analysis window'
        required: false
        default: '160'
      step:
        description: 'Step between evaluations'
        required: false
        default: '12'
      horizon:
        description: 'Candles to simulate after entry'
        required: false
        default: '32'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Hardened (2026-08-06): no external actions (GitHub action-download
      # service outage). Direct clone with built-in GITHUB_TOKEN.
      - name: 📥 Checkout (no external action)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      - name: 🐍 Prepare Python (system)
        run: |
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python || true
          python --version
          python -m pip install --upgrade pip

      - name: 📦 Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: 🧪 Run Backtest
        run: |
          python scripts/run_backtest.py \
            --timeframe "${{ github.event.inputs.timeframe }}" \
            --outputsize "${{ github.event.inputs.outputsize }}" \
            --window "${{ github.event.inputs.window }}" \
            --step "${{ github.event.inputs.step }}" \
            --horizon "${{ github.event.inputs.horizon }}" \
            --send-telegram
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 📤 Upload Backtest Report
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: |
            storage/backtest_report.json
            storage/backtest_trades.csv
