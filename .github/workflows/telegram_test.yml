name: 📱 Telegram Smoke Test

concurrency:
  group: telegram_test-${{ github.ref }}
  cancel-in-progress: true


on:
  workflow_dispatch:

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Hardened (2026-08-06): no external actions (GitHub action-download
      # service outage). Direct clone with built-in GITHUB_TOKEN.
      - name: 📥 Checkout (no external action)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      - name: 🐍 Prepare Python (system)
        run: |
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python || true
          python --version
          python -m pip install --upgrade pip

      - name: 📦 Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: 🔎 Validate Telegram Secrets
        run: |
          python scripts/validate_setup.py telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 📱 Send Telegram Test Message
        run: |
          python scripts/send_telegram_test.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
