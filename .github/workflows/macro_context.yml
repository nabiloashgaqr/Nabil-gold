name: 🧭 Hourly Macro Context

concurrency:
  group: macro-context-${{ github.ref }}
  cancel-in-progress: true

on:
  # Internal schedule disabled — triggered via external cron-job.org (workflow_dispatch)
  # schedule:
  #   - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  macro-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Hardened (2026-08-06): no external actions (GitHub action-download
      # service outage). Direct clone with built-in GITHUB_TOKEN.
      - name: 📥 Checkout (no external action)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      - name: 🐍 Prepare Python (system)
        run: |
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python || true
          python --version
          python -m pip install --upgrade pip

      - name: 📦 Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: 🧭 Update macro context
        run: |
          python scripts/update_macro_context.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: ✅ Success Log
        if: always()
        run: |
          echo "Macro context workflow completed at $(date)"
