name: 📊 SmartSignal Multi-Asset Analysis

concurrency:
  group: analyze-${{ github.ref }}
  # IMPORTANT: never cancel a run that is already in progress.
  # This is a signal bot: a run that is mid-analysis may be about to save a
  # trade and send a Telegram signal. cancel-in-progress:true would silently
  # kill it (e.g. when a manual run or a delayed external cron starts).
  cancel-in-progress: false

on:
  # Scheduling is intentionally handled by cron-job.org now.
  # This workflow is triggered externally via workflow_dispatch so analysis can
  # run every 5 minutes without relying on GitHub's best-effort schedule.
  workflow_dispatch:
    inputs:
      send_status:
        description: "Send WAIT / Market Status messages for this manual run"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Hardened (2026-08-06): NO external actions. For hours the GitHub
      # "resolve action download info" service returned 503/500, killing every
      # run at "Prepare all required actions" before checkout. A direct git
      # clone with the built-in GITHUB_TOKEN plus the runner's preinstalled
      # Python removes that dependency entirely.
      - name: 📥 Checkout (no external action)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      - name: 🐍 Prepare Python (system)
        run: |
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python || true
          python --version
          python -m pip install --upgrade pip

      - name: 📦 Install Dependencies
        run: |
          python -m pip install -r requirements.txt

      # SAFETY GATE: never emit live signals from a broken execution path.
      #
      # This runs inside the analyze job on purpose. A separate `guard` job
      # would add a second runner boot + checkout + pip install to a workflow
      # that fires every 5 minutes (~288 runs/day), roughly doubling both the
      # Actions minutes and the latency before a signal is sent -- unacceptable
      # for gold, which can move 50-100 points in seconds.
      #
      # Scope is limited to the execution-path suites that decide whether an
      # order is created, priced, or cancelled. Full-suite coverage belongs in
      # tests.yml, which already runs on every push and pull_request.
      - name: 🛡️ Execution-path invariants must hold
        run: |
          python -m pytest -q -x \
            tests/test_session_plan_ladder.py \
            tests/test_session_planner.py \
            tests/test_open_trades_manager.py \
            tests/test_planner_execution_gate.py \
            tests/test_day_map_sanity.py \
            tests/test_blocked_signal_safety_barrier.py \
            tests/test_execution_quality_guards.py \
            tests/test_dynamic_risk_wiring.py \
            tests/test_live_opposition_enforced.py \
            tests/test_execution_reject_is_honoured.py \
            tests/test_signal_final_validation.py \
            tests/test_cross_path_distance.py \
            tests/test_no_ignored_results.py \
            tests/test_message_truthfulness.py \
            tests/test_decision_audit.py \
            tests/test_selective_memory_and_moment.py \
            tests/test_reversal_after_sweep_archetype.py \
            tests/test_llm_model_fallback.py \
            tests/test_revived_plan_expiry.py \
            tests/test_thesis_objective_distance.py \
            tests/test_revived_plan_reauthorisation.py \
            tests/test_pending_fill_requires_live_touch.py \
            tests/test_authority_is_earned.py \
            tests/test_day_map_veto_scope.py \
            tests/test_authority_is_falsifiable.py \
            tests/test_analyst_scoreboard.py \
            tests/test_exit_replay_harness.py \
            tests/test_archetype_floors_are_earned.py \
            tests/test_swing_sweep_detection.py \
            tests/test_reversal_floor_is_earned.py \
            tests/test_swept_level_poi.py \
            tests/test_order_block_detection_window.py \
            tests/test_no_stop_entry_orders.py \
            tests/test_pending_survives_session_change.py \
            tests/test_plan_rejection_report_resilience.py \
            tests/test_reversal_archetype_coverage.py \
            tests/test_thesis_exit_agent_vote.py \
            tests/test_dynamic_risk_judges_the_plan.py \
            tests/test_thesis_exit_status_naming.py \
            tests/test_zone_touch_activation.py \
            tests/test_protected_trade_does_not_lock_the_map.py \
            tests/test_reversal_tightens_the_trail.py \
            tests/test_trailing_rule_message_is_true.py \
            tests/test_excursion_starts_at_the_fill.py \
            tests/test_incumbent_defends_with_its_own_score.py \
            tests/test_no_time_bomb_tests.py \
            tests/test_no_breakeven_while_offside.py \
            tests/test_trailed_stop_needs_later_price.py \
            tests/test_tp1_partial_is_booked.py \
            tests/test_pending_must_be_reachable.py \
            tests/test_cancellation_story_matches_reason.py \
            tests/test_tp1_booked_when_one_candle_spans_both.py \
            tests/test_published_zone_meets_the_floor.py \
            tests/test_targets_come_from_liquidity.py \
            tests/test_rejected_setups_are_not_traded.py \
            tests/test_post_tp2_reentry_block.py \
            tests/test_zone_floor_and_quality_labels.py \
            tests/test_silent_book_holds_the_trade.py \
            tests/test_analyst_labels_are_scoreable.py \
            tests/test_post_tp2_survives_adaptive_bypass.py \
            tests/test_young_pending_keeps_its_place.py \
            tests/test_near_miss_preserves_planned_risk.py \
            tests/test_activation_card_reports_the_fill.py \
            tests/test_post_tp2_sees_the_closed_trade.py \
            tests/test_block_message_states_the_real_window.py \
            tests/test_refused_plans_are_never_published.py \
            tests/test_stop_derived_rr_earns_nothing.py \
            tests/test_stop_liquidity_rule_200_70_400.py \
            tests/test_one_source_of_trading_rules.py \
            tests/test_pending_staleness_direction.py \
            tests/test_golden_dual_entry.py \
            tests/test_mt5_phase1.py \
            tests/test_tick_manager_logic.py \
            tests/test_vps_task_guards.py \
            tests/test_adaptive_execution.py \
            tests/test_smc_projects_liquidity_pools.py \
            tests/test_sl_floor_measures_every_path.py \
            tests/test_dashboard_numbers_agree.py \
            tests/test_dashboards_read_the_same_trades.py \
            tests/test_refusal_reason_names_the_shortfall.py \
            tests/test_report_shows_why_no_order.py \
            tests/test_planner_crash_names_its_site.py \
            tests/test_refusals_count_setups_not_cycles.py \
            tests/test_agent_bar_is_sixty_seven.py

      - name: 🔎 Validate Production Setup
        run: |
          python scripts/validate_setup.py analyze
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}

      - name: 🔍 Run Analysis
        run: |
          python scripts/run_analysis.py
        env:
          SEND_STATUS_ON_MANUAL: ${{ github.event.inputs.send_status || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: ✅ Success Log
        if: always()
        run: |
          echo "Analysis completed at $(date)"
