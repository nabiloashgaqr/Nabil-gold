name: 📊 SmartSignal Multi-Asset Analysis

concurrency:
  group: analyze-${{ github.ref }}
  # IMPORTANT: never cancel a run that is already in progress.
  # This is a signal bot: a run that is mid-analysis may be about to save a
  # trade and send a Telegram signal. cancel-in-progress:true would silently
  # kill it (e.g. when a manual run or a delayed external cron starts).
  cancel-in-progress: false

on:
  # Scheduling is intentionally handled by cron-job.org now.
  # This workflow is triggered externally via workflow_dispatch so analysis can
  # run every 5 minutes without relying on GitHub's best-effort schedule.
  workflow_dispatch:
    inputs:
      send_status:
        description: "Send WAIT / Market Status messages for this manual run"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          pip install -r requirements.txt

      # SAFETY GATE: never emit live signals from a broken execution path.
      #
      # This runs inside the analyze job on purpose. A separate `guard` job
      # would add a second runner boot + checkout + pip install to a workflow
      # that fires every 5 minutes (~288 runs/day), roughly doubling both the
      # Actions minutes and the latency before a signal is sent -- unacceptable
      # for gold, which can move 50-100 points in seconds.
      #
      # Scope is limited to the execution-path suites that decide whether an
      # order is created, priced, or cancelled. Full-suite coverage belongs in
      # tests.yml, which already runs on every push and pull_request.
      - name: 🛡️ Execution-path invariants must hold
        run: |
          python -m pytest -q -x \
            tests/test_session_plan_ladder.py \
            tests/test_session_planner.py \
            tests/test_open_trades_manager.py \
            tests/test_planner_execution_gate.py \
            tests/test_day_map_sanity.py \
            tests/test_blocked_signal_safety_barrier.py \
            tests/test_execution_quality_guards.py \
            tests/test_dynamic_risk_wiring.py \
            tests/test_live_opposition_enforced.py \
            tests/test_execution_reject_is_honoured.py \
            tests/test_signal_final_validation.py \
            tests/test_cross_path_distance.py \
            tests/test_no_ignored_results.py \
            tests/test_message_truthfulness.py \
            tests/test_decision_audit.py \
            tests/test_selective_memory_and_moment.py

      - name: 🔎 Validate Production Setup
        run: |
          python scripts/validate_setup.py analyze
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}

      - name: 🔍 Run Analysis
        run: |
          python scripts/run_analysis.py
        env:
          SEND_STATUS_ON_MANUAL: ${{ github.event.inputs.send_status || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: ✅ Success Log
        if: always()
        run: |
          echo "Analysis completed at $(date)"
